# TEMPLATE ONLY, do not apply as is. build_and_deploy.sh creates the real Secret (random values)
# when it does not exist, and never overwrites an existing one. To create it by hand:
#   kubectl create secret generic security-dashboard-auth -n security-ops \
#     --from-literal=SUPERUSER_PASSWORD="$(openssl rand -base64 18)" \
#     --from-literal=USER_PASSWORD="$(openssl rand -base64 18)" \
#     --from-literal=AUTH_SECRET="$(openssl rand -hex 32)"
# Changing AUTH_SECRET invalidates all login tokens. Passwords may also be pbkdf2_sha256$<iter>$<salt_b64>$<hash_b64>.
apiVersion: v1
kind: Secret
metadata:
  name: security-dashboard-auth
  namespace: security-ops
type: Opaque
stringData:
  SUPERUSER_PASSWORD: "CHANGE_ME_superuser_password"
  USER_PASSWORD: "CHANGE_ME_user_password"
  AUTH_SECRET: "CHANGE_ME_output_of_openssl_rand_-hex_32"
