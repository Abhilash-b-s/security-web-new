apiVersion: v1
kind: Namespace
metadata:
  name: security-ops
---
# The auth Secret (security-dashboard-auth) is NOT part of this file so a re-apply can never reset
# the credentials. See dashboard-secret.example.yaml; build_and_deploy.sh creates it if missing.
# RBAC lives in dashboard-rbac.yaml, the kube-bench admission policy in dashboard-admission-policy.yaml.
# Security Dashboard Service
apiVersion: v1
kind: Service
metadata:
  name: security-dashboard
  namespace: security-ops
spec:
  type: NodePort
  selector:
    app: security-dashboard
  ports:
    - name: api
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30095
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-dashboard-sa
  namespace: security-ops
---
# Persistent storage for scan output, run reports and settings, so a redeploy keeps them.
# No storageClassName: uses the cluster default (local-path on the lab cluster).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: security-dashboard-data
  namespace: security-ops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Security Dashboard Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-dashboard
  namespace: security-ops
spec:
  replicas: 1
  # One writer on the ReadWriteOnce volume: stop the old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: security-dashboard
  template:
    metadata:
      labels:
        app: security-dashboard
    spec:
      serviceAccountName: security-dashboard-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # fsGroup is a no-op for hostPath-backed PVs such as local-path; the seed-data init
        # container below chowns the volume, which covers that case.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Create the report, run-history and state directories on the volume.
        - name: seed-data
          image: quay.io/abhilash_bs1/security-dashboard:latest
          imagePullPolicy: Always
          command: ["sh", "-c", "mkdir -p /data/new /data/reports /data/state && chown -R 10001:10001 /data"]
          # Root only for this one-shot, with just the capabilities chown needs.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: security-dashboard
          image: quay.io/abhilash_bs1/security-dashboard:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: security-dashboard-auth
          env:
            - name: APP_HOME
              value: "/app"
            - name: STATE_DIR
              value: "/app/state"
            # Image used for the short-lived kube-bench Job (must match the admission policy's image prefix).
            - name: DASHBOARD_IMAGE
              value: "quay.io/abhilash_bs1/security-dashboard:latest"
            # The web terminal (an interactive kubectl shell) is off. Set to "true" and re-apply to
            # enable it; superuser only, every command is written to the audit log.
            - name: ENABLE_TERMINAL
              value: "false"
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # The image only writes to /app/new, /app/state, the reports dir (PVC) and /tmp (emptyDir).
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Persistent data (see PersistentVolumeClaim above)
            - name: data
              mountPath: /app/new
              subPath: new
            - name: data
              mountPath: /app/security-dashboard/backend/reports
              subPath: reports
            - name: data
              mountPath: /app/state
              subPath: state
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: security-dashboard-data
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: security-dashboard
  namespace: security-ops
  annotations:
    # Keep scan-log and terminal WebSockets open past nginx's 60s default
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: security-dashboard.10.10.0.35.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: security-dashboard
                port:
                  number: 8000
---
# Runs every scan (scan_type "all", sequential) twice a day through the dashboard API.
# The scans execute inside the dashboard pod; this job only triggers them.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: security-dashboard-scheduled-scans
  namespace: security-ops
spec:
  schedule: "0 2,14 * * *" # 02:00 and 14:00 in the controller's timezone (UTC unless spec.timeZone is set)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trigger
              image: quay.io/abhilash_bs1/security-dashboard:latest
              imagePullPolicy: IfNotPresent
              # SUPERUSER_PASSWORD comes from the auth Secret; the trigger logs in for a token.
              envFrom:
                - secretRef:
                    name: security-dashboard-auth
              command:
                - sh
                - -c
                - |
                  set -e
                  API=http://security-dashboard.security-ops.svc:8000/api
                  # Scans are superuser-gated now: authenticate, then call with a Bearer token.
                  BODY=$(jq -nc --arg u superuser --arg p "$SUPERUSER_PASSWORD" '{username:$u,password:$p}')
                  TOKEN=$(curl -sf -X POST "$API/login" -H 'Content-Type: application/json' -d "$BODY" | jq -r .token)
                  if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then echo "Login failed"; exit 1; fi
                  AUTH="Authorization: Bearer $TOKEN"
                  # Skip if scans are already running: the same scan twice would overwrite its output files.
                  if [ "$(curl -sf -H "$AUTH" "$API/scans/active" | tr -d ' ')" != "[]" ]; then echo "Scans already running, skipping"; exit 0; fi
                  curl -sf -X POST -H "$AUTH" "$API/scans/start" -H 'Content-Type: application/json' -d '{"scan_type":"all"}'
